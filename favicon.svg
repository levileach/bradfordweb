<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#f5f4f0"/>

  <!-- L: vertical bar + full-width foot -->
  <polygon points="0,0 11,0 11,40 50,40 50,50 0,50" fill="#111110"/>

  <!-- B: outer bumps + white counter cutouts -->
  <path d="M 50,0 L 89,0 C 108,0 108,25 89,25 C 110,25 110,50 89,50 L 50,50 Z
           M 61,4 C 96,4 96,21 61,21 Z
           M 61,28 C 98,28 98,46 61,46 Z"
        fill="#111110" fill-rule="evenodd"/>

  <!-- W: four-stroke polygon -->
  <polygon points="0,50 12,50 25,88 38,50 50,50 50,58 33,100 25,82 17,100 0,58" fill="#111110"/>

  <!-- D: curved shape + white counter cutout -->
  <path d="M 50,50 L 62,50 C 102,50 102,100 62,100 L 50,100 Z
           M 62,59 C 90,59 90,91 62,91 Z"
        fill="#111110" fill-rule="evenodd"/>
</svg>
